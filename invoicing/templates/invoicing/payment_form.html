{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-gray-100">Record Customer Payment</h1>
            <p class="text-xs text-gray-400">Receive funds and allocate against outstanding tax invoices</p>
        </div>
        <a href="{% url 'invoicing:payment_list' %}" class="btn-secondary">Back to Payments</a>
    </div>

    <form method="POST" class="card">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group col-span-2">
                <label class="form-label">Customer</label>
                <select name="customer_id" class="form-control" required>
                    <option value="">-- Choose Customer --</option>
                    {% for c in customers %}
                    <option value="{{ c.id }}">{{ c.customer_code }} - {{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Payment Date</label>
                <input type="date" name="payment_date" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Amount Received (₹)</label>
                <input type="number" step="0.01" name="amount" class="form-control" required placeholder="177000.00">
            </div>
            <div class="form-group">
                <label class="form-label">Payment Method</label>
                <select name="payment_method" class="form-control">
                    <option value="BANK_TRANSFER">Bank Transfer / NEFT / RTGS</option>
                    <option value="UPI">UPI / GPay / PhonePe</option>
                    <option value="CHEQUE">Cheque</option>
                    <option value="CASH">Cash</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">UTR / Ref Number</label>
                <input type="text" name="reference_number" class="form-control" placeholder="e.g. UTR123456789">
            </div>
            <div class="form-group col-span-2 border-t border-gray-800 pt-3">
                <label class="form-label">Allocate Payment to Invoice (Optional)</label>
                <select name="invoice_id" class="form-control">
                    <option value="">-- Leave Unallocated / General Advance --</option>
                    {% for inv in invoices %}
                    <option value="{{ inv.id }}">{{ inv.invoice_number }} - {{ inv.customer.name }} (Due: ₹{{ inv.balance_due }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mt-4 flex justify-end">
            <button type="submit" class="btn-primary">Record Payment & Generate Receipt</button>
        </div>
    </form>
</div>
{% endblock %}
