{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                <a href="{% url 'invoicing:payment_made_list' %}" class="hover:text-white">Disbursements</a> / 
                <span class="text-[#1E5BFF]">Record Payment</span>
            </div>
            <h1 class="text-xl font-extrabold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                <i data-lucide="arrow-up-right" class="w-5 h-5 text-emerald-500"></i>
                Record Payment Made to Vendor
            </h1>
        </div>
        <a href="{% url 'invoicing:payment_made_list' %}" class="btn-secondary text-xs">Back to List</a>
    </div>

    <form method="POST" class="card space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group md:col-span-2">
                <label class="form-label font-semibold">Vendor / Beneficiary <span class="text-red-500">*</span></label>
                <select name="vendor_id" class="form-control" required>
                    <option value="">-- Choose Vendor --</option>
                    {% for v in vendors %}
                    <option value="{{ v.id }}" {% if request.GET.vendor_id == v.id|stringformat:"s" %}selected{% endif %}>
                        {{ v.vendor_code }} — {{ v.name }} (Outstanding AP: ₹{{ v.balance_due|floatformat:2 }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label font-semibold">Disbursement Amount (₹) <span class="text-red-500">*</span></label>
                <input type="number" step="0.01" min="0.01" name="amount" class="form-control font-bold text-base" placeholder="50000.00" required>
            </div>

            <div class="form-group">
                <label class="form-label font-semibold">Payment Date <span class="text-red-500">*</span></label>
                <input type="date" name="payment_date" value="{% now 'Y-m-d' %}" class="form-control" required>
            </div>

            <div class="form-group">
                <label class="form-label font-semibold">Payment Method</label>
                <select name="payment_method" class="form-control">
                    <option value="BANK_TRANSFER">Bank Transfer / NEFT / RTGS</option>
                    <option value="UPI">UPI / NetBanking</option>
                    <option value="CHEQUE">Cheque</option>
                    <option value="CASH">Cash</option>
                    <option value="CREDIT_CARD">Credit Card</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label font-semibold">Disbursed From Bank Account</label>
                <select name="bank_account_id" class="form-control">
                    {% for bank in bank_accounts %}
                    <option value="{{ bank.id }}">{{ bank.bank_name }} — {{ bank.account_name }} (₹{{ bank.current_balance|floatformat:2 }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group md:col-span-2">
                <label class="form-label font-semibold">Apply to Specific Vendor Bill (Optional FIFO)</label>
                <select name="bill_id" class="form-control">
                    <option value="">-- Auto Allocate Across Open Bills (FIFO) --</option>
                    {% for b in open_bills %}
                    <option value="{{ b.id }}">
                        {{ b.bill_number }} — {{ b.vendor.name }} (Due: ₹{{ b.balance_due|floatformat:2 }})
                    </option>
                    {% endfor %}
                </select>
                <p class="text-[11px] text-slate-400 mt-1">If left blank, the disbursement is automatically allocated against oldest outstanding bills for this vendor (FIFO).</p>
            </div>

            <div class="form-group md:col-span-2">
                <label class="form-label font-semibold">Reference / UTR / Cheque Number</label>
                <input type="text" name="reference_number" class="form-control font-mono" placeholder="UTR/Cheque/Transaction reference">
            </div>

            <div class="form-group md:col-span-2">
                <label class="form-label font-semibold">Payment Notes</label>
                <textarea name="notes" rows="2" class="form-control" placeholder="Remittance remarks, voucher notes, or approvals..."></textarea>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end">
            <button type="submit" class="btn-primary flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Post Disbursement to Ledger
            </button>
        </div>
    </form>
</div>
{% endblock %}
