{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-gray-100">Edit Leave Application #{{ leave.id }}</h1>
            <p class="text-xs text-gray-400">Update leave request details for {{ leave.employee.full_name }}</p>
        </div>
        <a href="{% url 'hr:leave_list' %}" class="btn-secondary">Back to Leaves</a>
    </div>

    <form method="POST" class="card">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group col-span-2">
                <label class="form-label">Employee</label>
                <input type="text" class="form-control bg-gray-800 text-gray-400 cursor-not-allowed" value="{{ leave.employee.employee_id }} - {{ leave.employee.full_name }} ({{ leave.employee.department }})" readonly disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Leave Type</label>
                <select name="leave_type_id" class="form-control" required>
                    {% for lt in leave_types %}
                    <option value="{{ lt.id }}" {% if lt.id == leave.leave_type.id %}selected{% endif %}>{{ lt.name }} (Quota: {{ lt.yearly_quota }} days)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Duration Days</label>
                <input type="number" step="0.5" name="duration_days" class="form-control" value="{{ leave.duration_days }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ leave.start_date|date:'Y-m-d' }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" value="{{ leave.end_date|date:'Y-m-d' }}" required>
            </div>
            <div class="form-group col-span-2">
                <label class="form-label">Reason for Leave</label>
                <textarea name="reason" class="form-control" rows="3" required>{{ leave.reason }}</textarea>
            </div>
        </div>

        <div class="mt-6 flex justify-between items-center">
            <a href="{% url 'hr:leave_action' leave.id 'cancel' %}" class="btn-secondary text-amber-400 hover:text-amber-300">Cancel Application</a>
            <div class="flex gap-2">
                <a href="{% url 'hr:leave_list' %}" class="btn-secondary">Discard Changes</a>
                <button type="submit" class="btn-primary">Save & Update Application</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
