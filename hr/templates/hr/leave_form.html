{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-gray-100">Submit Leave Application</h1>
            <p class="text-xs text-gray-400">Request leave approval from HR / Manager</p>
        </div>
        <a href="{% url 'hr:leave_list' %}" class="btn-secondary">Back to Leaves</a>
    </div>

    <form method="POST" class="card">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group col-span-2">
                <label class="form-label">Employee</label>
                <select name="employee_id" class="form-control" required>
                    {% if not user_employee and is_hr_admin %}
                    <option value="">-- Select Employee --</option>
                    {% endif %}
                    {% for e in employees %}
                    {% if is_hr_admin or e.id == user_employee.id %}
                    <option value="{{ e.id }}" {% if user_employee and e.id == user_employee.id %}selected{% endif %}>
                        {{ e.employee_id }} - {{ e.full_name }} ({{ e.department }})
                    </option>
                    {% endif %}
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Leave Type</label>
                <select name="leave_type_id" class="form-control" required>
                    {% for lt in leave_types %}
                    <option value="{{ lt.id }}">{{ lt.name }} (Quota: {{ lt.yearly_quota }} days)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Duration Days</label>
                <input type="number" step="0.5" name="duration_days" class="form-control" value="1.0" required>
            </div>
            <div class="form-group">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" required>
            </div>
            <div class="form-group col-span-2">
                <label class="form-label">Reason for Leave</label>
                <textarea name="reason" class="form-control" rows="3" placeholder="Reason for leave request..." required></textarea>
            </div>
        </div>

        <div class="mt-4 flex justify-end">
            <button type="submit" class="btn-primary">Submit Leave Request</button>
        </div>
    </form>
</div>
{% endblock %}
