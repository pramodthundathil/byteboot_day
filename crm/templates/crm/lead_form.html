{% extends 'base.html' %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-gray-100">Create New Sales Lead</h1>
            <p class="text-xs text-gray-400">Capture prospective business opportunities</p>
        </div>
        <a href="{% url 'crm:lead_list' %}" class="btn-secondary">Back to Leads</a>
    </div>

    <form method="POST" class="card">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label class="form-label">Company / Client Name</label>
                <input type="text" name="company_name" class="form-control" required placeholder="e.g. Acme Tech Solutions">
            </div>
            <div class="form-group">
                <label class="form-label">Contact Person</label>
                <input type="text" name="contact_person" class="form-control" required placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" required placeholder="+91 9876543210">
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="john@acme.com">
            </div>
            <div class="form-group">
                <label class="form-label">Service Interested</label>
                <input type="text" name="service_interested" class="form-control" value="Software Development ERP">
            </div>
            <div class="form-group">
                <label class="form-label">Estimated Deal Value (₹)</label>
                <input type="number" step="0.01" name="estimated_value" class="form-control" value="150000.00">
            </div>
            <div class="form-group">
                <label class="form-label">Priority</label>
                <select name="priority" class="form-control">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                    <option value="URGENT">Urgent</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Lead Source</label>
                <select name="source" class="form-control">
                    <option value="Website">Website Inbound</option>
                    <option value="Referral">Client Referral</option>
                    <option value="Cold Call">Cold Call / Outreach</option>
                    <option value="Social Media">Social Media</option>
                </select>
            </div>
            <div class="form-group col-span-2">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="2" placeholder="Billing or office address"></textarea>
            </div>
        </div>

        <div class="mt-4 flex justify-end">
            <button type="submit" class="btn-primary">Save Lead Record</button>
        </div>
    </form>
</div>
{% endblock %}
